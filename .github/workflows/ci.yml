name: Test and package
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pyqt6 qt6-wayland apt-utils gnupg desktop-file-utils
      - name: Test application and package
        run: QT_QPA_PLATFORM=offscreen /usr/bin/python3 -m unittest discover -s tests -v
